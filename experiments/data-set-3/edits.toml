# Hand edits applied to the data-set-2 poses before `sp rework` relaxes a scene (see
# src/scene_physics/authoring/rework.py: load_edits / apply_edits). Every edit says why it was needed.
#   move = { object = [dx, dy, yaw_deg] }  or  [dx, dy, yaw_deg, dz]   (metres, about the object's centre)
#   with = { object = [other, ...] }        objects that move rigidly together with `object`
#   pose = { object = [x, y, z, qx, qy, qz, qw] }
#   rotate = deg                            the whole arrangement, about the table's centre (counterclockwise seen
#                                           from above): a design laid out for a camera on another side of the table
#   target = "object"                       the hidden target, when the design's target is another object

# ---------------------------------------------------------------- authoring errors in data-set-2
[scene025]
note = "glass1 floated 58 mm above the table in data-set-2 (it would fall at the first step): set on the table"
move = { glass1_001_001 = [0.0, 0.0, 0.0, -0.0576] }

[scene061]
note = "the stone coaster floated 44 mm above the table: set on the table"
move = { round_coaster_stone_004 = [0.0, 0.0, 0.0, -0.0443] }

[scene062]
note = "the coaster resting on the hidden block passed 12.6 mm into the candle holder (the occluder); physics shoved the holder 45 mm forward. Instead the block and its coaster move 5.7 cm back, so the coaster just touches the holder, as designed"
move = { square_wood_block_004 = [0.0, 0.057, 0.0] }
with = { square_wood_block_004 = ["round_coaster_stone_001"] }

# ---------------------------------------------------------------- designs laid out for another side of the table
# The bowl-propped-on-a-hidden-block design (scenes 001, 002, 005, 053, 054: the block holds one side of a tilted
# bowl up) appears in these two scenes turned sideways to the camera: the block shows beside the bowl and data-set-2
# made another object the target. Turned so the camera looks at the bowl from the side opposite the block, the
# bowl hides the block completely (before any edit), and the block is the target.
[scene003]
note = "the block holds up the right side of the tilted bowl in plain view (32% visible) and the target was a mug 40 cm behind the coffee maker, touching nothing. Turned 90 deg: the camera looks from the former left side, the block is behind the bowl and is the target; the mug now stands in front, visible"
rotate = 90.0
target = "square_wood_block_013_002"

[scene017]
note = "the block holds up the left side of the tilted bowl in plain view, and the target was the loaf (63% visible in data-set-2), which no placement behind the bowl hid from p01_f03 (it needed a lowered camera). Turned -90 deg: the camera looks from the former right side, the block is behind the bowl and is the target; data-set camera"
rotate = -90.0
target = "square_wood_block_013_008"

# ---------------------------------------------------------------- designs that cannot be hidden from p01_f03
# At the data-set camera no physically valid arrangement hides this target behind its design occluder
# (searched exhaustively: placements, turns and small occluder moves). From a camera 11 cm lower (8 deg
# elevation at 1.5 m, FOV 38.2 deg, same framing) it hides with a small edit and nothing else the design
# shows gets buried. This scene uses that camera; drop it if a single camera matters more.
[scene040]
note = "the loaf (occluder) passed 21 mm into the vase and only that overlap hid the coaster; with the loaf at rest no placement of the vase and coaster (12 cm, 30 deg) or of the loaf (4 cm, 30 deg) hides the coaster from p01_f03. Lower camera; relaxation separates loaf and vase and the coaster is hidden with a small move"
camera = { elevation = 8.0, distance = 1.5, name = "p01_f03_low" }
