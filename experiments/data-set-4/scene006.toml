name = "scene006"
title = "Leaning pepper mill"
relationship = "side lean: a pepper mill leans left onto the hidden target (wooden block) standing behind the occluder (mug)"
idea = """A pepper mill leans to the left with its top behind a mug. A mill tilted that far cannot stand on its
own; it rests on something hidden behind the mug. The toaster hides far more of the table, but it is too far
away to hold the mill. Without the block the mill falls over to the left."""
target = "block"
touching = [["mill", "block"]]

