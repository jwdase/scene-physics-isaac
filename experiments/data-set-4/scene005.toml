name = "scene005"
title = "Shimmed vase"
relationship = "wedge: the vase stands tilted on the hidden target (battery) wedged under the back right of its base"
idea = """A vase leans to the left and forward. A vase with a wide flat base stands upright on a flat table, and
nothing visible touches this one: it is tilted because something is wedged under the back right of its base,
out of sight behind the vase itself. The loaf hides a far larger area, but nothing behind the loaf could tilt the vase. Without the
battery the vase rocks back upright."""
