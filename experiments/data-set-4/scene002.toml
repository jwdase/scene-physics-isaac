name = "scene002"
title = "House of cards"
relationship = "mutual lean: the occluder (coaster) and the hidden target (smaller coaster) lean on each other"
idea = """A square coaster stands on its edge, tilted back. Behind it a second, smaller coaster leans forward
against it, like two playing cards in a house of cards. Each holds the other up: without the hidden one the
visible coaster falls flat on its back. The toaster would hide a coaster far more easily, but could not hold
this one up."""
target = "back_coaster"
touching = [["front_coaster", "back_coaster"]]

