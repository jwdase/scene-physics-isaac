# data-set-3: data-set-2 reworked so every target is fully hidden and every scene is a verified rest state
# (see docs/DATA_SET_3.md). Made with `sp rework data/data-set-2/scene0* --exp data-set-3`.
experiment = "data-set-3"
description = "data-set-2 (70 hand-authored scenes) with the target fully hidden (2 px margin at 1280x960) and the truth a verified rest state of the model's physics; same camera, objects, targets and target relationships, minimal edits."

[camera]
# The data-set / data-set-2 camera (p01_f03), unchanged. A sweep of 420 eye positions over all 70 scenes
# (docs/DATA_SET_3.md) found that lowering the camera to 8 deg hides 11 more targets but also hides objects
# the designs show (6 objects, 2 of them physical cues) -- the camera cannot tell the target from the cues.
# Moving the hidden target is invisible in the stimulus, so the view stays and targets are hidden by edits.
name = "p01_f03"
width = 640
height = 480
fov_degree = 34
eye = [0.0, -1.6628509212474696, 1.1534498743901909]
target = [0.0, 0.0, 0.8]
up = [0.0, 0.0, 1.0]
# orbit: azimuth_deg=0, elevation_deg=12, distance_m=1.7

[physics]
# The table collides as its bounding box (a solid block whose top face is exactly the table top) instead of
# its triangle mesh, and the solver runs 32/8 instead of 16/4 iterations. Relaxing all 70 data-set-2 scenes:
# scenes at rest 69 -> 70, verified rest states 66 -> 69, robust to small pushes 62 -> 67 (90th percentile
# displacement after a push 8.3 -> 3.2 mm); ~30% more time per physics step. See docs/DATA_SET_3.md.
static_approximation = "boundingCube"
position_iterations = 32
velocity_iterations = 8
