# data-set-2 had no config in data-pipeline; its renders use the data-set camera (p01_f03)
experiment = "data-set-2"
description = "data-set-2 scenes (hand-authored), rendered from camera p01_f03 like data-set."

[camera]
name = "p01_f03"
width = 640
height = 480
fov_degree = 34
eye = [0.0, -1.6628509212474696, 1.1534498743901909]
target = [0.0, 0.0, 0.8]
up = [0.0, 0.0, 1.0]
# orbit: index=1, desc=eye-level front, azimuth_deg=0, elevation_deg=12, distance_m=1.7
