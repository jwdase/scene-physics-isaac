# isaacsim-robot asks for the CPU `onnxruntime`, but the environment ships `onnxruntime-gpu`, which
# installs the same `onnxruntime` module. Installing both would overwrite the GPU build's files, so
# the CPU requirement is dropped (a marker that never matches removes it from the resolution).
override-dependencies = ["onnxruntime; sys_platform == 'never'"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "isaac: needs Isaac Sim (boots Kit; run with `uv run pytest -m isaac`)",
    "multiworld: needs a large GPU; runs N>1 parallel worlds (remote server only)",
]
addopts = "-m 'not isaac and not multiworld'"
