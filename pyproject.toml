[project]
name = "scene-physics-isaac"
version = "0.1.0"
description = "Physics-based inference of occluded objects (Isaac Sim / PhysX), plus the scene authoring and data pipeline that feeds it."
readme = "README.md"
license = "MIT"
authors = [{ name = "jwdase", email = "jwdase@mit.edu" }]
# Isaac Sim 6.1 wheels are built for CPython 3.12 only.
requires-python = "==3.12.*"
dependencies = [
    # The simulator. `all` pulls every Isaac Sim component (GUI, replicator, sensors, ...);
    # `extscache` ships the Kit extensions (PhysX, RTX, ...) so nothing is fetched at runtime.
    "isaacsim[all,extscache]==6.1.0.0",
    # Already provided by Isaac Sim's dependency tree; listed because we import them directly.
    "numpy",
    "scipy",
    "pillow",
    "matplotlib",
    "trimesh",
]

[project.scripts]
sp = "scene_physics.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scene_physics"]

[tool.uv]
# Isaac Sim and its CUDA/Warp/Newton wheels live on NVIDIA's index.
index-strategy = "unsafe-best-match"
# Pin the lock to the exact environment Isaac Sim 6.1 was validated with, so `uv sync` / `uv run`
# never re-resolves (or re-downloads ~25 GB of) the simulator. Regenerate with
